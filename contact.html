<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Alex Morgan about a project.">
  <title>Contact | Alex Morgan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header inner-header">
    <nav class="nav container" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="Alex Morgan, home">AM<span>.</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu"><span></span><span></span><span></span></button>
      <div class="nav-links" id="nav-links">
        <a class="nav-link" href="index.html">Home</a><a class="nav-link" href="about.html">About</a><a class="nav-link" href="skills.html">Skills</a><a class="nav-link" href="projects.html">Projects</a><a class="nav-link active" href="contact.html">Contact</a>
      </div>
      <a class="nav-cta" href="contact.html">Let’s talk</a>
    </nav>
  </header>
  <main>
    <section class="page-hero"><div class="container"><p class="section-kicker">04 / Contact</p><h1>Have a project?<br><em>Let’s make it real.</em></h1></div></section>
    <section class="section contact page-section">
      <div class="container contact-grid">
        <div class="contact-copy">
          <p class="section-kicker">Start a conversation</p>
          <h2>Tell me what<br><em>you’re building.</em></h2>
          <p>I’ll reply within two business days.</p>
          <a class="email-link" href="mailto:hello@alexmorgan.dev">hello@alexmorgan.dev <span>↗</span></a>
        </div>
        <form class="contact-form" id="contact-form" novalidate>
          <div class="form-row">
            <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required><span class="field-error"></span></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required><span class="field-error"></span></div>
          </div>
          <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" placeholder="Project inquiry" required><span class="field-error"></span></div>
          <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Tell me a little about your project" required></textarea><span class="field-error"></span></div>
          <button class="button button-primary submit-button" type="submit">Send message <span aria-hidden="true">↗</span></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container footer-inner"><a class="brand footer-brand" href="index.html">AM<span>.</span></a><p>© <span id="year"></span> Alex Morgan</p><div class="socials"><a href="#">LinkedIn</a><a href="#">GitHub</a></div></div></footer>
  <script src="script.js"></script>
</body>
</html>
